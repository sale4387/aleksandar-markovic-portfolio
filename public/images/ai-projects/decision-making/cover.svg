<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" fill="none">
  <defs>
    <filter id="shadow" x="0" y="0" width="1200" height="750" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#102449" flood-opacity=".16"/>
    </filter>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F3E8FF"/>
      <stop offset="1" stop-color="#E8F0FF"/>
    </linearGradient>
    <linearGradient id="phone" x1="360" x2="840" y1="80" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#182333"/>
      <stop offset="1" stop-color="#0B1728"/>
    </linearGradient>
    <linearGradient id="header" x1="410" x2="790" y1="86" y2="158" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#3B1D5D"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="750" rx="44" fill="url(#bg)"/>
  <circle cx="1080" cy="96" r="180" fill="#E9D5FF" opacity=".7"/>
  <circle cx="120" cy="670" r="170" fill="#DBEAFE" opacity=".6"/>

  <g filter="url(#shadow)">
    <rect x="388" y="52" width="424" height="646" rx="46" fill="url(#phone)"/>
    <rect x="410" y="86" width="380" height="578" rx="32" fill="#182638"/>
    <rect x="410" y="86" width="380" height="72" rx="32" fill="url(#header)"/>
    <rect x="410" y="130" width="380" height="28" fill="#48206C"/>

    <circle cx="448" cy="123" r="24" fill="#6DD6FF"/>
    <path d="M438 123l8 8 17-20" stroke="#F43F5E" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="486" y="116" fill="#F8FAFC" font-family="Arial" font-size="24" font-weight="700">Help Me Choose</text>
    <text x="486" y="141" fill="#D8C8F5" font-family="Arial" font-size="13">Telegram decision assistant</text>

    <rect x="432" y="182" width="326" height="392" rx="20" fill="#26374A"/>
    <text x="456" y="220" fill="#F8FAFC" font-family="Arial" font-size="24" font-weight="700">🎯 Goal</text>
    <text x="456" y="252" fill="#F8FAFC" font-family="Arial" font-size="19">Decide between cooking Chinese</text>
    <text x="456" y="278" fill="#F8FAFC" font-family="Arial" font-size="19">food at home or ordering food</text>

    <text x="456" y="326" fill="#F8FAFC" font-family="Arial" font-size="22" font-weight="700">⚠ Constraints</text>
    <text x="456" y="356" fill="#F8FAFC" font-family="Arial" font-size="17">• Time availability</text>
    <text x="456" y="382" fill="#F8FAFC" font-family="Arial" font-size="17">• Ingredient inventory</text>
    <text x="456" y="408" fill="#F8FAFC" font-family="Arial" font-size="17">• Energy levels</text>
    <text x="456" y="434" fill="#F8FAFC" font-family="Arial" font-size="17">• Budget</text>

    <text x="456" y="486" fill="#F8FAFC" font-family="Arial" font-size="22" font-weight="700">🧩 Options</text>
    <text x="456" y="520" fill="#F8FAFC" font-family="Arial" font-size="18" font-weight="700">▶ Cook at home</text>
    <text x="456" y="548" fill="#D1FAE5" font-family="Arial" font-size="15">Pros: lower cost · ingredient control</text>
    <text x="456" y="574" fill="#FECACA" font-family="Arial" font-size="15">Cons: prep time · cleanup</text>

    <rect x="482" y="596" width="276" height="48" rx="20" fill="#7C3AED"/>
    <text x="508" y="626" fill="#fff" font-family="Arial" font-size="16" font-weight="700">View next steps + assessment</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="74" y="118" width="260" height="196" rx="24" fill="#FFFFFF"/>
    <text x="104" y="160" fill="#17365F" font-family="Arial" font-size="22" font-weight="700">Structured output</text>
    <text x="104" y="190" fill="#64748B" font-family="Arial" font-size="14">Goal · constraints · options</text>
    <rect x="104" y="222" width="170" height="28" rx="14" fill="#F3E8FF"/>
    <text x="121" y="242" fill="#6D28D9" font-family="Arial" font-size="13" font-weight="700">Pros & cons</text>
    <rect x="104" y="260" width="190" height="28" rx="14" fill="#E6F0FF"/>
    <text x="121" y="280" fill="#17365F" font-family="Arial" font-size="13" font-weight="700">Next steps</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="858" y="420" width="266" height="174" rx="24" fill="#FFFFFF"/>
    <text x="888" y="462" fill="#17365F" font-family="Arial" font-size="22" font-weight="700">Assessment</text>
    <text x="888" y="493" fill="#64748B" font-family="Arial" font-size="14">Reviewable decision summary</text>
    <rect x="888" y="526" width="176" height="32" rx="16" fill="#DCFCE7"/>
    <text x="906" y="548" fill="#166534" font-family="Arial" font-size="13" font-weight="700">Quality: good</text>
  </g>
</svg>
